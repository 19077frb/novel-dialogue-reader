name: Database regression checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'AGENTS.md'
      - 'scripts/verify.ps1'
      - 'docs/openapi.json'
      - '.github/workflows/schema-indexes.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --project backend --locked --group dev
      - name: Check backend code
        run: uv run --project backend python -m ruff check backend/src backend/tests backend/scripts
      - name: Check OpenAPI consistency
        env:
          PYTHONUTF8: '1'
        run: uv run --project backend python backend/scripts/export_openapi.py --output docs/openapi.json --check

  tests:
    name: Tests (${{ matrix.group }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [unit, database, integration-1, integration-2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --project backend --locked --group dev
      - name: Run complete test group with timing report
        env:
          PYTHONUTF8: '1'
          TEST_GROUP: ${{ matrix.group }}
        run: uv run --project backend python backend/scripts/run_test_group.py --group $env:TEST_GROUP --junitxml "test-results/$env:TEST_GROUP.xml"
      - name: Upload timing and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.group }}
          path: test-results/*.xml
          retention-days: 7

  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci
      - name: Check frontend types
        run: npm --prefix frontend run typecheck
      - name: Check frontend API consistency
        run: npm --prefix frontend run check:api
      - name: Run frontend tests
        run: npm --prefix frontend run test
      - name: Build frontend production assets
        run: npm --prefix frontend run build

  database:
    # Keep the original overall check name; success requires every group.
    needs: [checks, tests, frontend]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require all backend and database checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if ($env:CHECKS_RESULT -ne 'success' -or $env:TESTS_RESULT -ne 'success' -or $env:FRONTEND_RESULT -ne 'success') {
            throw "Backend checks: $env:CHECKS_RESULT; test groups: $env:TESTS_RESULT; frontend build: $env:FRONTEND_RESULT"
          }
