# Alembic configuration.
# NOTE: this file is intentionally ASCII-only: Alembic reads it with the platform
# locale codec (GBK on some Windows machines), so non-ASCII comments break startup.
#
# script_location and prepend_sys_path are resolved from %(here)s (the directory of
# this config file), so running backend/alembic.ini from any cwd behaves the same.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# The real URL is derived in migrations/env.py from ndr.config.Settings
# (data dir can be overridden with NDR_DATA_DIR). Leaving this empty means
# "no explicit override"; tests may inject config.attributes["sqlalchemy_url"].
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S