[project]
name = "ndr"
version = "1.0.0"
description = "轻小说对话辅助阅读器（Novel Dialogue Reader）后端"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "cssselect2>=0.8,<0.11",
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring>=24",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "tinycss2>=1.4,<1.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
packaging = ["pyinstaller>=6.16,<7"]
dev = [
    "jsonschema>=4.21",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 缓存放在仓库内（已 .gitignore），这样受限沙箱中也能读写依赖缓存。
[tool.uv]
cache-dir = "../.uv-cache"

[tool.hatch.build.targets.wheel]
packages = ["src/ndr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 让测试可以直接 import fixtures.*（原创夹具构造器放在 tests/fixtures/）。
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "UP012"]  # 测试里显式写 encode("utf-8") 更清楚
"src/ndr/api/*.py" = ["B008"]  # FastAPI 依赖/表单参数的惯用写法
"../migrations/versions/**" = ["E501"]
